# Licence policy: docs/plan/09-rust-workspace.md §2, owner decision D5.
[licenses]
# The allow list is the full set of GPL-3.0-compatible licences pre-approved under D5,
# so entries that no current dependency uses are expected.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    # ffmpeg-next / ffmpeg-sys-next (WP-2.14b); GPL-compatible per the FSF.
    "WTFPL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
    "GPL-2.0-or-later",
    "GPL-3.0-or-later",
    "GPL-3.0-only",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
# Owner-approved 2026-10-01: audiopus_sys 0.2.2 is unmaintained.
# Its reported CMake 4 bundled-build failure is avoided by the mandatory dynamic
# feature and system libopus; Linux/Mac synthetic linkage probes pass.
# This exception covers this informational advisory only, not vulnerabilities.
ignore = ["RUSTSEC-2026-0150"]
