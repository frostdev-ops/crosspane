[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]
exclude = ["spikes", "fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-or-later"
repository = "https://github.com/frostdev-ops/crosspane"
publish = false

[workspace.dependencies]
crosspane-types = { path = "crates/crosspane-types" }
crosspane-protocol = { path = "crates/crosspane-protocol" }
crosspane-security = { path = "crates/crosspane-security" }
crosspane-input = { path = "crates/crosspane-input" }
crosspane-media = { path = "crates/crosspane-media" }
crosspane-platform = { path = "crates/crosspane-platform" }
crosspane-engine = { path = "crates/crosspane-engine" }
crosspane-transport = { path = "crates/crosspane-transport" }
crosspane-render = { path = "crates/crosspane-render" }
crosspane-testkit = { path = "crates/crosspane-testkit" }
crosspane-platform-linux = { path = "crates/crosspane-platform-linux" }
crosspane-platform-macos = { path = "crates/crosspane-platform-macos" }

# External crates (09 §2). Versions checked 2026-09-30.
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
euclid = { version = "0.22.14", features = ["serde"] }
pollster = "1.0.1"
proptest = "1.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
wgpu = "30.0.1"
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
debug = "line-tables-only"
