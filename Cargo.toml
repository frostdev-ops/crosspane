[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]
exclude = ["spikes", "fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-or-later"
repository = "https://github.com/frostdev-ops/crosspane"
publish = false

[workspace.dependencies]
crosspane-types = { path = "crates/crosspane-types" }
crosspane-protocol = { path = "crates/crosspane-protocol" }
crosspane-security = { path = "crates/crosspane-security" }
crosspane-input = { path = "crates/crosspane-input" }
crosspane-media = { path = "crates/crosspane-media" }
crosspane-platform = { path = "crates/crosspane-platform" }
crosspane-engine = { path = "crates/crosspane-engine" }
crosspane-transport = { path = "crates/crosspane-transport" }
crosspane-render = { path = "crates/crosspane-render" }
crosspane-testkit = { path = "crates/crosspane-testkit" }
crosspane-platform-linux = { path = "crates/crosspane-platform-linux" }
crosspane-platform-macos = { path = "crates/crosspane-platform-macos" }
crosspane-installer-core = { path = "crates/crosspane-installer-core" }
crosspane-ui-kit = { path = "crates/crosspane-ui-kit" }

# External crates (09 §2). Versions checked 2026-09-30.
anyhow = "1.0.104"
aws-lc-rs = "1.18.1"
clap = { version = "4.6.7", features = ["derive"] }
euclid = { version = "0.22.14", features = ["serde"] }
font8x8 = "0.3.1"
opus = "=0.3.1"
audiopus_sys = { version = "=0.2.2", features = ["dynamic"] }
pipewire = "=0.10.1"
rtrb = "=0.4.0"
lz4_flex = { version = "0.14.0", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
pollster = "1.0.1"
proptest = "1.11.0"
prost = "0.14.4"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs", "log"] }
rustix = { version = "1.1.5", features = ["fs", "shm", "mm", "event", "time", "net", "process"] }
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "std", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
smithay-client-toolkit = "0.21.1"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tracing = "0.1.44"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "unstable", "staging"] }
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
wgpu = "30.0.1"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen"] }
# The settings app (crosspane-ui). Same wgpu and winit as crosspane-render. No default_fonts: those
# are OFL/Ubuntu-font licensed (not in the D5 policy), so the app loads a system font at runtime.
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "wayland"] }
# egui for the shared UI kit (WP-4.2), the same version eframe uses; no default_fonts (see eframe).
egui = { version = "0.36.2", default-features = false }
# PNG decoding for the settings app's brand art (WP-2.44); already in the tree via eframe's clipboard.
png = "0.18.1"
xkbcommon = "0.9.0"
zbus = { version = "5.19.0", default-features = false, features = ["blocking-api", "async-io"] }
# H.264 on Linux through FFmpeg (WP-2.14b; 09 §2 allows FFmpeg as a thin wrapper).
ffmpeg-next = { version = "9.0.0", default-features = false, features = ["codec", "format", "software-scaling"] }
# mDNS discovery (WP-1.6, 09 §2).
mdns-sd = { version = "0.21.4", default-features = false }
# Interface enumeration for the link classifier (WP-1.7/1.8); already in the tree via mdns-sd.
if-addrs = "0.15.0"
# StatusNotifierItem tray (WP-1.34, Linux), on the same zbus/async-io stack.
ksni = { version = "0.3.6", default-features = false, features = ["async-io", "blocking"] }
zerocopy = { version = "0.8.59", features = ["derive"] }
zeroize = "1.9.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
toml = "1.1.6"

# macOS bindings (09 §2: objc2 0.6 family 0.3). Versions checked 2026-10-01.
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-application-services = "0.3.2"
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat", "block2"] }
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-core-media = "0.3.2"
objc2-core-video = "0.3.2"
objc2-foundation = "0.3.2"
objc2-video-toolbox = "0.3.2"
# GPU zero-copy (GPU-v0): Metal textures over IOSurfaces; Vulkan DMA-BUF allocation; libcuda at run time.
objc2-metal = { version = "0.3.2", features = ["objc2-io-surface"] }
objc2-io-surface = "0.3.2"
ash = "0.38.0"
libloading = "0.8.9"
objc2-screen-capture-kit = "0.3.2"
security-framework = "3.7.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
debug = "line-tables-only"
