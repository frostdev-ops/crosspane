name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Keep cold builds and caches within the standard hosted runners' disk budget.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  policy:
    name: Formatting and policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        # Read the toolchain and components from rust-toolchain.toml.
        run: rustup toolchain install
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: policy
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Install policy tools
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-deny@0.20.2,actionlint@1.7.12
      - name: Check formatting
        run: cargo fmt --check
      - name: Check workflow
        run: actionlint
      - name: Check dependency policy
        run: cargo deny --locked check
      - name: Fetch the complete dependency graph
        # The layering check inspects Linux and macOS graphs with --offline.
        run: cargo fetch --locked
      - name: Check layering
        run: scripts/check-layering.sh

  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-24.04
          - name: macOS
            runner: macos-15
          - name: Windows
            runner: windows-2025
    env:
      CROSSPANE_REQUIRE_GPU: "1"
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: native-${{ matrix.runner }}
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Install test runner
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest@0.9.148
      - name: Install Linux libraries and software GPU
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libopus-dev libpipewire-0.3-dev libclang-dev pkg-config cmake mesa-vulkan-drivers fonts-dejavu-core
          mkdir -p "$RUNNER_TEMP/xdg-runtime"
          chmod 700 "$RUNNER_TEMP/xdg-runtime"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/xdg-runtime" >> "$GITHUB_ENV"
          echo "CROSSPANE_TEST_FONT=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf" >> "$GITHUB_ENV"
      - name: Install macOS libraries
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install opus pkg-config
          echo "OPUS_LIB_DIR=$(brew --prefix opus)" >> "$GITHUB_ENV"
          test -f /System/Library/Fonts/Supplemental/Arial.ttf
          echo "CROSSPANE_TEST_FONT=/System/Library/Fonts/Supplemental/Arial.ttf" >> "$GITHUB_ENV"
          # Hosted VMs do not have a Local Network permission grant.
          echo "CROSSPANE_NO_MULTICAST=1" >> "$GITHUB_ENV"
      - name: Configure Windows native builds
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # audiopus_sys builds bundled Opus with the runner's MSVC/CMake tools.
          "OPUS_STATIC=1" >> $env:GITHUB_ENV
          "AWS_LC_SYS_PREBUILT_NASM=1" >> $env:GITHUB_ENV
          $testFont = Join-Path $env:WINDIR 'Fonts\arial.ttf'
          if (!(Test-Path $testFont)) { throw "Missing system test font: $testFont" }
          "CROSSPANE_TEST_FONT=$testFont" >> $env:GITHUB_ENV
      - name: Check lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo nextest run --workspace --locked --no-tests=pass --no-fail-fast
      - name: Check the opt-in macOS virtual-display module
        if: runner.os == 'macOS'
        run: |
          cargo clippy -p crosspane-platform-macos --all-targets --features private-vdisplay --locked -- -D warnings
          cargo nextest run -p crosspane-platform-macos --features private-vdisplay --locked --no-tests=pass --no-fail-fast
      - name: Build documentation
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
