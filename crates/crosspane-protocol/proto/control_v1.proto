syntax = "proto3";
package crosspane.control.v1;

message ControlMessage {
  oneof body {
    Hello hello = 1;
    Displays displays = 2;
    Layout layout = 3;
    StartControl start_control = 4;
    ControlStarted control_started = 5;
    ControlRefused control_refused = 6;
    EndControl end_control = 7;
    Grants grants = 8;
    Revocation revocation = 9;
    Ping ping = 10;
    Pong pong = 11;
    Goodbye goodbye = 12;
    Projection projection = 13;
    AudioOpen audio_open = 14;
    AudioStream audio_opened = 15;
    AudioRefused audio_refused = 16;
    AudioStream audio_close = 17;
    ClipOffer clip_offer = 18;
    ClipWithdraw clip_withdraw = 19;
    ClipFetch clip_fetch = 20;
    ClipFetchFailed clip_fetch_failed = 21;
  }
}

message Hello { uint32 minor = 1; string name = 2; repeated string features = 3; repeated Display displays = 4; }

enum ColorSpace { COLOR_SPACE_SRGB = 0; COLOR_SPACE_DISPLAY_P3 = 1; COLOR_SPACE_BT709 = 2; }

message Display {
  uint32 id = 1; string name = 2;
  double physical_w_mm = 3; double physical_h_mm = 4;
  uint32 pixel_w = 5; uint32 pixel_h = 6;
  double scale = 7; double logical_x = 8; double logical_y = 9;
  // Strict Rust decode: color_space's original varint must be 0..=2147483647 and a known code.
  uint32 refresh_millihz = 10; ColorSpace color_space = 11; bool hdr = 12;
}
message Displays { repeated Display displays = 1; }

message Placement { bytes node = 1; uint32 display = 2; double origin_x_mm = 3; double origin_y_mm = 4; uint64 version = 5; }
message Layout { repeated Placement placements = 1; }

enum LockKey { LOCK_KEY_UNKNOWN = 0; LOCK_KEY_OFF = 1; LOCK_KEY_ON = 2; }
// Strict Rust decode: caps' original varint must be 0..=2147483647 and a known code.
// Strict Rust decode: num's original varint must be 0..=2147483647 and a known code.
// Strict Rust decode: scroll's original varint must be 0..=2147483647 and a known code.
message LockKeys { LockKey caps = 1; LockKey num = 2; LockKey scroll = 3; }

message StartControl { uint64 session = 1; uint32 entry_display = 2; double entry_x = 3; double entry_y = 4; LockKeys lock_keys = 5; }
message ControlStarted { uint64 session = 1; }

enum Refusal { REFUSAL_UNSPECIFIED = 0; REFUSAL_PERMISSION = 1; REFUSAL_LOCKED = 2; REFUSAL_SECURE_INPUT = 3; REFUSAL_BUSY = 4; REFUSAL_INJECTOR_FAILED = 5; }
// Strict Rust decode: reason's original varint must be 0..=2147483647 and a known nonzero code.
message ControlRefused { uint64 session = 1; Refusal reason = 2; }

enum EndReason { END_REASON_UNSPECIFIED = 0; END_REASON_RELEASED = 1; END_REASON_PANIC = 2; END_REASON_TARGET_LOCKED = 3; END_REASON_CONTROLLER_LOCKED = 4; END_REASON_LINK_LOST = 5; END_REASON_REVOKED = 6; }
// Strict Rust decode: reason's original varint must be 0..=2147483647 and a known nonzero code.
message EndControl { uint64 session = 1; EndReason reason = 2; }

enum Capability { CAPABILITY_UNSPECIFIED = 0; CAPABILITY_INPUT_ACCEPT = 1; CAPABILITY_WINDOW_SHARE = 2; CAPABILITY_WINDOW_BROWSE = 3; CAPABILITY_WINDOW_PRESENT = 4; CAPABILITY_AUDIO_SPEAKER = 5; CAPABILITY_AUDIO_MIC = 6; CAPABILITY_CLIPBOARD_READ = 7; CAPABILITY_CLIPBOARD_WRITE = 8; }
// Strict Rust decode: each capabilities varint must be 0..=2147483647 and a known nonzero code.
message Grants { repeated Capability capabilities = 1; }

message Revocation { bytes revoked = 1; bytes issuer = 2; uint64 issued_at_ms = 3; bytes signature = 4; }
message Ping { uint64 t0 = 1; }
message Pong { uint64 t0 = 1; uint64 t1 = 2; uint64 t2 = 3; }
message Goodbye { string message = 1; }

// E2 projection; unknown nested variants are ignored as UnknownControl.
message Projection {
  oneof body {
    ProjectionStart start = 1;
    ProjectionAccepted accepted = 2;
    ProjectionRefused refused = 3;
    ProjectionResize resize = 4;
    ProjectionGeometry geometry = 5;
    ProjectionTitle title = 6;
    ProjectionFocus focus = 7;
    ProjectionKeyFrameRequest key_frame_request = 8;
    ProjectionEnd end = 9; // Source -> destination: close the proxy.
    ProjectionClose close = 10; // Destination -> source: restore the source window.
    ProjectionListWindows list_windows = 11;
    ProjectionWindowList window_list = 12;
    ProjectionPull pull = 13;
    ProjectionBrowseRefused browse_refused = 14;
    ProjectionProxyPlaced proxy_placed = 15; // Destination -> source: where the proxy's content is (WP-2.43).
    ProjectionStartAt start_at = 16;
    ProjectionReturnAt return_at = 17;
    ProjectionDragReady drag_ready = 18;
    ProjectionDragCancel drag_cancel = 19;
  }
}

// uint32 enum codes (0 and unknown codes are invalid):
// parking: 1 Twin, 2 Mirror.
// end reason: 1 Returned, 2 WindowClosed, 3 Revoked, 4 Locked, 5 LinkLost, 6 Failed.
// refusal: same 1..5 codes as Refusal above.
// title/app_id are capped at 1024 UTF-8 bytes; scale must be finite and positive.
message ProjectionStart {
  uint64 projection = 1;
  string title = 2;
  string app_id = 3;
  uint32 pixel_w = 4;
  uint32 pixel_h = 5;
}

// DRAG-v0: placement uses device pixels on the receiver's display. Continuation token/anchor
// are ignored unless drag is true; ReturnAt requires drag = false.
message ProjectionStartAt {
  uint64 projection = 1; string title = 2; string app_id = 3;
  uint32 pixel_w = 4; uint32 pixel_h = 5; uint32 display = 6;
  sint32 x = 7; sint32 y = 8; bool drag = 9; uint32 token = 10;
  sint32 anchor_x = 11; sint32 anchor_y = 12;
}
message ProjectionReturnAt {
  uint64 projection = 1; uint32 display = 2; sint32 x = 3; sint32 y = 4; bool drag = 5;
}
message ProjectionDragReady {
  uint64 projection = 1; uint32 token = 2; uint32 display = 3; double x = 4; double y = 5;
}
message ProjectionDragCancel { uint64 projection = 1; uint32 token = 2; }

message ProjectionAccepted {
  uint64 projection = 1;
  uint32 pixel_w = 2;
  uint32 pixel_h = 3;
  double scale = 4;
}

message ProjectionRefused {
  uint64 projection = 1;
  uint32 reason = 2;
}

message ProjectionResize {
  uint64 projection = 1;
  uint32 pixel_w = 2;
  uint32 pixel_h = 3;
  double scale = 4;
  uint32 request = 5;
}

message ProjectionGeometry {
  uint64 projection = 1;
  uint32 pixel_w = 2;
  uint32 pixel_h = 3;
  uint32 parking = 4;
  uint32 answers = 5;
}

message ProjectionTitle {
  uint64 projection = 1;
  string title = 2;
}

message ProjectionFocus {
  uint64 projection = 1;
  bool focused = 2;
}

message ProjectionKeyFrameRequest {
  uint64 projection = 1;
}

message ProjectionEnd {
  uint64 projection = 1;
  uint32 reason = 2;
}

message ProjectionClose {
  uint64 projection = 1;
  uint32 reason = 2;
}

message ProjectionListWindows {
  uint32 request = 1;
}

// At most 256 windows; each title/app_id is capped at 1024 UTF-8 bytes.
message ProjectionWindowList {
  uint32 request = 1;
  repeated BrowsableWindow windows = 2;
}

message BrowsableWindow {
  uint64 window = 1;
  string title = 2;
  string app_id = 3;
  uint32 width = 4;
  uint32 height = 5;
}

message ProjectionPull {
  uint32 request = 1;
  uint64 window = 2;
}

message ProjectionBrowseRefused {
  uint32 request = 1;
  uint32 reason = 2; // Same 1..5 codes as Refusal above.
}

// WP-2.43. generation grows with every change and repeats on a resend; placed = false: the proxy
// is on no display; display, origin and size are then stale and ignored. origin_x/origin_y must
// be finite.
message ProjectionProxyPlaced {
  uint64 projection = 1;
  uint32 generation = 2;
  bool placed = 3;
  uint32 display = 4;
  double origin_x = 5;
  double origin_y = 6;
  uint32 pixel_w = 7;
  uint32 pixel_h = 8;
}

// D8: kind 1 speaker(stereo), 2 microphone(mono); stream 1..65535.
message AudioOpen { uint32 stream = 1; uint32 kind = 2; uint32 channels = 3; }
message AudioStream { uint32 stream = 1; }
message AudioRefused { uint32 stream = 1; uint32 reason = 2; }

// CLIP-v0: no content on the control stream; 0/unknown enum codes are rejected.
enum ClipKind { CLIP_KIND_UNSPECIFIED = 0; CLIP_KIND_TEXT = 1; CLIP_KIND_IMAGE = 2; }
enum ClipFailure { CLIP_FAILURE_UNSPECIFIED = 0; CLIP_FAILURE_EXPIRED = 1; CLIP_FAILURE_LOCKED = 2; CLIP_FAILURE_NOT_GRANTED = 3; CLIP_FAILURE_TOO_LARGE = 4; CLIP_FAILURE_UNAVAILABLE = 5; }
// Strict Rust decode: each kinds varint must be 0..=2147483647 and a known nonzero code.
message ClipOffer { uint64 offer = 1; repeated ClipKind kinds = 2; } // 1..=2 distinct kinds.
message ClipWithdraw { uint64 offer = 1; }
// Strict Rust decode: kind's original varint must be 0..=2147483647 and a known nonzero code.
message ClipFetch { uint64 fetch = 1; uint64 offer = 2; ClipKind kind = 3; }
// Strict Rust decode: reason's original varint must be 0..=2147483647 and a known nonzero code.
message ClipFetchFailed { uint64 fetch = 1; ClipFailure reason = 2; }
