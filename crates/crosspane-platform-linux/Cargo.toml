[package]
name = "crosspane-platform-linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
if-addrs.workspace = true
crosspane-types.workspace = true
crosspane-media.workspace = true
crosspane-platform.workspace = true

[features]
ffmpeg = ["dep:ffmpeg-next"]
# Zero-copy GPU paths (GPU-v0): DMA-BUF capture into wgpu textures (Vulkan through ash).
gpu = ["dep:wgpu", "dep:ash"]
# NVENC from GPU memory: libcuda is loaded at run time, so builds need no CUDA toolkit.
cuda = ["gpu", "ffmpeg", "dep:libloading"]

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { workspace = true, optional = true }
ash = { workspace = true, optional = true }
libloading = { workspace = true, optional = true }
pipewire.workspace = true
rtrb.workspace = true
font8x8.workspace = true
ksni.workspace = true
# H.264 through FFmpeg (WP-2.14b); off by default because CI images ship an older FFmpeg.
ffmpeg-next = { workspace = true, optional = true }
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
smithay-client-toolkit.workspace = true
thiserror.workspace = true
tracing.workspace = true
wayland-client.workspace = true
wayland-protocols.workspace = true
wayland-protocols-misc.workspace = true
wayland-protocols-wlr.workspace = true
xkbcommon.workspace = true
zbus.workspace = true
zeroize.workspace = true

[dev-dependencies]
pollster.workspace = true
