[package]
name = "crosspane-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
crosspane-types.workspace = true
crosspane-engine.workspace = true
crosspane-input.workspace = true
crosspane-media.workspace = true
crosspane-render.workspace = true
crosspane-platform.workspace = true
crosspane-protocol.workspace = true
crosspane-security.workspace = true
crosspane-transport.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
wgpu.workspace = true
pollster.workspace = true
zeroize.workspace = true

[features]
# The owner-approved private-API module (D7): hide projected Mac windows on a CGVirtualDisplay twin.
# Off by default; a build with it still needs `mac_virtual_display = true` in config.toml.
private-vdisplay = ["crosspane-platform-macos/private-vdisplay"]
# H.264 for windows with motion (WP-2.14): FFmpeg on Linux, VideoToolbox on macOS.
video = ["crosspane-platform-linux/ffmpeg", "crosspane-platform-linux/cuda"]

[target.'cfg(target_os = "linux")'.dependencies]
crosspane-platform-linux = { workspace = true, features = ["gpu"] }
rustix = { workspace = true, features = ["process"] }

[target.'cfg(target_os = "macos")'.dependencies]
crosspane-platform-macos = { workspace = true, features = ["gpu"] }
