[package]
name = "crosspane-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
crosspane-types.workspace = true
crosspane-engine.workspace = true
crosspane-input.workspace = true
crosspane-media.workspace = true
crosspane-render.workspace = true
crosspane-platform.workspace = true
crosspane-protocol.workspace = true
crosspane-security.workspace = true
crosspane-transport.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
wgpu.workspace = true
pollster.workspace = true
rtrb.workspace = true
zeroize.workspace = true
socket2 = "=0.6.5"
xxhash-rust.workspace = true
# `process` (the effective uid for `status`) is a workspace feature, so it is the same on both OSes.
rustix.workspace = true

[features]
# The owner-approved private-API module (D7): hide projected Mac windows on a CGVirtualDisplay twin.
# Off by default; a build with it still needs `mac_virtual_display = true` in config.toml.
private-vdisplay = ["crosspane-platform-macos/private-vdisplay"]
# H.264 for windows with motion: FFmpeg on Linux, VideoToolbox on macOS, MF on Windows.
video = ["crosspane-platform-linux/ffmpeg", "crosspane-platform-linux/cuda", "crosspane-platform-windows/video"]

[target.'cfg(target_os = "linux")'.dependencies]
crosspane-platform-linux = { workspace = true, features = ["gpu"] }

[target.'cfg(target_os = "macos")'.dependencies]
crosspane-platform-macos = { workspace = true, features = ["gpu"] }

[target.'cfg(windows)'.dependencies]
crosspane-platform-windows.workspace = true
tokio = { workspace = true, features = ["io-util"] }
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }
