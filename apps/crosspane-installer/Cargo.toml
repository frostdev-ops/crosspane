[package]
name = "crosspane-installer"
description = "Crosspane installer and setup guide (WP-4.3 onwards)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The injected-parts seam (`LinuxPlatform::compose`, `MacPlatform::compose`) for this crate's own
# integration tests. Never enabled by a build of the installer itself.
test-hooks = []

[dependencies]
crosspane-installer-core.workspace = true
crosspane-types.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
aws-lc-rs.workspace = true
anyhow.workspace = true
clap.workspace = true
crosspane-ui-kit.workspace = true
eframe.workspace = true
png.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix.workspace = true

# Shared macOS settings and permission adapters use the existing objc2 frameworks.
[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-core-foundation.workspace = true
objc2-core-graphics.workspace = true
objc2-foundation.workspace = true
# Lead ruling 2026-10-04: the production SignatureProbe (public Security framework, read-only).
objc2-security.workspace = true

# WP-4.8b/c (Linux detection): logind/Secret Service/PipeWire names over the admitted buses, and a
# registry-only Wayland read, both on streams from native_io's pinned connections.
[target.'cfg(target_os = "linux")'.dependencies]
crosspane-platform-linux.workspace = true
pipewire.workspace = true
zbus.workspace = true
wayland-client.workspace = true

# WP-W4.1a0: public native foundations for the accepted Windows backend packages.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_TaskScheduler",
    "Win32_System_Variant",
    "Win32_UI_Shell",
] }
windows-sys = { workspace = true, features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }
tokio.workspace = true
xxhash-rust.workspace = true

# This crate's integration tests turn on its own test seam; normal builds never do.
[dev-dependencies]
crosspane-installer = { path = ".", features = ["test-hooks"] }
