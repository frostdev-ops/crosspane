[package]
name = "crosspane-installer"
description = "Crosspane installer and setup guide (WP-4.3 onwards)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "crosspane-tutorial"
path = "src/tutorial.rs"

[lints]
workspace = true

[dependencies]
crosspane-installer-core.workspace = true
crosspane-types.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
aws-lc-rs.workspace = true
anyhow.workspace = true
clap.workspace = true
crosspane-ui-kit.workspace = true
eframe.workspace = true
png.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix.workspace = true

# WP-4.16 (macOS tutorial adapter): own-window observation and CoreAudio output through objc2.
[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-core-foundation.workspace = true
objc2-core-graphics.workspace = true
objc2-foundation.workspace = true

# WP-4.8b/c (Linux detection): logind/Secret Service/PipeWire names over the admitted buses, and a
# registry-only Wayland read, both on streams from native_io's pinned connections.
[target.'cfg(target_os = "linux")'.dependencies]
zbus.workspace = true
wayland-client.workspace = true
